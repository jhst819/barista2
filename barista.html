<!DOCTYPE html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>바리스타 주문판</title>
<style>
  :root{
    --ink:#17211E; --deep:#1F3A34; --deep-2:#2C5149;
    --paper:#F2F1EC; --card:#FFFFFF; --line:#DAD8D0; --muted:#6B7570;
    --wait:#8A8F98; --work:#C0711A; --done:#2E7D4F; --ship:#2B5FA8;
    --hot:#B4462B; --ice:#2B72A8; --urg:#C02A1B; --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:18px;line-height:1.5;-webkit-user-select:none;user-select:none}
  button{font-family:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px 120px}

  header{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff}
  .bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
  .sta{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .sta small{display:block;font-size:13px;font-weight:500;opacity:.75;letter-spacing:0}
  .count{margin-left:auto;font-size:15px;opacity:.9}
  .count b{font-size:26px;font-weight:800}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#7BC79A;margin-right:6px}
  .dot.off{background:#E29A8C}
  .iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;
    min-width:52px;height:52px;font-size:15px;font-weight:700;padding:0 12px;cursor:pointer}
  .iconbtn:active{background:rgba(255,255,255,.28)}

  .tabs{background:var(--deep-2)}
  .tabs-in{max-width:1200px;margin:0 auto;display:flex;width:100%}
  .tab{flex:1;border:0;background:transparent;color:rgba(255,255,255,.65);
    font-size:19px;font-weight:700;padding:16px 8px;cursor:pointer;border-bottom:5px solid transparent}
  .tab[aria-selected="true"]{color:#fff;border-bottom-color:#F0C24B;background:rgba(0,0,0,.12)}
  .tab .n{display:inline-block;min-width:30px;margin-left:6px;padding:1px 8px;border-radius:20px;
    background:rgba(255,255,255,.2);font-size:15px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:18px}
  .card{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--wait);
    border-radius:var(--r);padding:16px 18px;text-align:left;width:100%;display:block;cursor:pointer}
  .card:active{background:#F6F5F1}
  .card.work{border-left-color:var(--work)}
  .card.urgent{border-left-color:var(--urg)}
  .menu{font-size:30px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:15px;font-weight:800;border-radius:7px;padding:4px 10px;flex:none;line-height:1.3}
  .tag.h{background:var(--hot);color:#fff}
  .tag.i{background:var(--ice);color:#fff}
  .tag.mycup{background:#2E7D4F;color:#fff}
  .tag.time{background:#E7E5DE;color:var(--ink)}
  .tag.time.urg{background:var(--urg);color:#fff}
  .who{margin-top:9px;font-size:19px;color:var(--muted);font-weight:600}
  .who b{color:var(--ink);font-weight:700}
  .note{margin-top:9px;font-size:16px;background:#FFF6DC;border-radius:8px;padding:7px 10px}
  .flag{margin-top:10px;font-size:16px;font-weight:700;color:var(--work)}
  .flag.ok{color:var(--done)}

  .make{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .make-top{background:#F7F6F2;padding:18px 20px;border-bottom:1px solid var(--line)}
  .make-top .menu{font-size:34px}
  .steps{list-style:none;margin:0;padding:8px 12px}
  .step{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px}
  .step.now{background:#FFF8E8;box-shadow:inset 0 0 0 2px #F0C24B}
  .step.past{opacity:.42}
  .num{flex:none;width:44px;height:44px;border-radius:50%;background:#E7E5DE;color:var(--muted);
    display:grid;place-items:center;font-size:20px;font-weight:800}
  .step.now .num{background:var(--work);color:#fff}
  .step.past .num{background:var(--done);color:#fff}
  .txt{font-size:23px;font-weight:600;letter-spacing:-.02em}
  .step.past .txt{text-decoration:line-through}
  .hint{margin:0 12px 10px;font-size:16px;color:var(--muted);padding:10px 14px;background:#F4F3EF;border-radius:10px}

  .actions{display:flex;gap:12px;padding:14px;border-top:1px solid var(--line);background:#FAF9F6}
  .btn{border:0;border-radius:12px;font-size:24px;font-weight:800;padding:22px 16px;cursor:pointer;letter-spacing:-.02em}
  .btn:active{transform:translateY(1px)}
  .btn.go{flex:1;background:var(--done);color:#fff}
  .btn.ship{flex:1;background:var(--ship);color:#fff}
  .btn.back{background:#E7E5DE;color:var(--ink);font-size:19px;padding:22px 20px}
  .btn.help{background:#F0C24B;color:#3A2C00;font-size:19px;padding:22px 20px}
  .btn[disabled]{opacity:.5}

  .place{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px}
  .place h3{margin:0;font-size:27px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .floor{font-size:15px;font-weight:800;background:var(--deep);color:#fff;border-radius:7px;padding:4px 10px}
  .cups{margin:12px 0 0;padding:0;list-style:none}
  .cups li{font-size:20px;padding:8px 0;border-top:1px solid #EFEDE6}
  .place .btn{width:100%;margin-top:14px}

  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .big{font-size:26px;font-weight:700;color:var(--ink)}
  .empty p{font-size:18px}

  .pick{min-height:100vh;display:grid;place-items:center;padding:24px}
  .pick-in{width:100%;max-width:760px}
  .pick h1{font-size:38px;font-weight:800;letter-spacing:-.04em;margin:0 0 6px}
  .pick p{color:var(--muted);margin:0 0 28px;font-size:18px}
  .pickbtn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:22px 24px;margin-bottom:12px;cursor:pointer;border-left:10px solid var(--deep)}
  .pickbtn:active{background:#F6F5F1}
  .pickbtn b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em}
  .pickbtn span{color:var(--muted);font-size:17px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px}
  .panel h3{margin:0 0 6px;font-size:21px;font-weight:800}
  .panel p{margin:0 0 14px;color:var(--muted);font-size:16px}
  .panel label{display:block;font-size:16px;font-weight:700;margin:14px 0 6px}
  input[type=text],textarea,select{width:100%;font-family:inherit;font-size:17px;padding:13px 14px;
    border:1px solid var(--line);border-radius:10px;background:#FCFBF8;color:var(--ink);
    -webkit-user-select:text;user-select:text}
  textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .sbtn{border:0;background:var(--deep);color:#fff;border-radius:10px;font-size:17px;font-weight:700;
    padding:14px 20px;cursor:pointer}
  .sbtn.ghost{background:#E7E5DE;color:var(--ink)}
  .sbtn.warn{background:#B4462B;color:#fff}
  table{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
  th,td{border-bottom:1px solid #EFEDE6;padding:9px 6px;text-align:left}
  th{color:var(--muted);font-weight:700;font-size:14px}
  code{background:#F0EEE8;padding:2px 6px;border-radius:5px;font-size:14px;word-break:break-all}
  .msg{margin-top:12px;font-size:16px;padding:12px 14px;border-radius:10px;background:#EDF3EF;color:#1E5137}
  .msg.bad{background:#FBEDE9;color:#8C3520}

  .overlay{position:fixed;inset:0;background:rgba(31,58,52,.96);color:#fff;z-index:50;
    display:grid;place-items:center;text-align:center;padding:24px}
  .overlay .big{font-size:46px;font-weight:800;letter-spacing:-.04em;margin-bottom:10px}
  .overlay p{font-size:20px;opacity:.85;margin:0 0 30px}
  .banner{background:#FBEDE9;color:#8C3520;font-size:15px;padding:10px 16px;text-align:center}
</style>

<div id="root"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   [0] 동기화 주소  ★ 여기 한 줄만 고치시면 두 태블릿이 연결됩니다 ★

   Apps Script를 배포하면 나오는 웹앱 주소를 따옴표 안에 붙여넣으세요.
   예) var SYNC_URL = "https://script.google.com/macros/s/AKfycb.../exec";

   비워 두면 이 태블릿에서만 쓰는 '혼자 모드'로 작동합니다.
   주소 없이 시험만 해 보시려면 페이지 주소 뒤에 ?sync=주소 를 붙여도 됩니다.
   ══════════════════════════════════════════════════════════════════════ */
var SYNC_URL = "https://script.google.com/macros/s/AKfycbxOXKrXHfVCjKrexFGLTgYDLbUVvWkKUn6Ka-BlqwSsDUzPMabKZ2IxOp2pITPNZ2Mf0w/exec";

/* ══════════════════════════════════════════════════════════════════════
   [1] 레시피 — 실제 실습 절차에 맞게 이 부분만 고치시면 됩니다.
   ══════════════════════════════════════════════════════════════════════ */
var MENUS = {
  "ame-h":{name:"아메리카노", temp:"HOT",
    hint:"물과 샷은 순서를 바꿔도 괜찮아요.",
    cup:["컵을 준비해요","뜨거운 물을 컵의 2/3만큼 부어요"],
    finish:["에스프레소 2샷을 부어요","뚜껑을 덮어요","트레이에 올려요"]},

  "ame-i":{name:"아메리카노", temp:"ICE",
    hint:"물과 샷은 순서를 바꿔도 괜찮아요.",
    cup:["컵을 준비해요","얼음을 컵에 가득 담아요","찬물을 얼음 위까지 부어요"],
    finish:["에스프레소 2샷을 부어요","빨대를 꽂아요","트레이에 올려요"]},

  "latte-h":{name:"카페라떼", temp:"HOT",
    cup:["컵을 준비해요","우유거품기에 우유를 MAX 선까지 부어요","거품기를 작동시켜요"],
    finish:["에스프레소 2샷을 컵에 부어요","데운 우유를 부어요","뚜껑을 덮어요","트레이에 올려요"]},

  "latte-i":{name:"카페라떼", temp:"ICE",
    cup:["컵을 준비해요","얼음을 컵에 가득 담아요","우유 130ml를 부어요"],
    finish:["에스프레소 2샷을 부어요","빨대를 꽂아요","트레이에 올려요"]},

  /* 바닐라라떼 — 파우더·시럽은 에스프레소 자리에서 샷잔에 먼저 넣습니다 */
  "van-h":{name:"바닐라라떼", temp:"HOT",
    cup:["컵을 준비해요","우유거품기에 우유를 MAX 선까지 부어요","거품기를 작동시켜요"],
    finish:["바닐라 샷을 컵에 부어요","데운 우유를 부어요","뚜껑을 덮어요","트레이에 올려요"]},

  "van-i":{name:"바닐라라떼", temp:"ICE",
    cup:["컵을 준비해요","얼음을 컵에 가득 담아요","우유 130ml를 부어요"],
    finish:["바닐라 샷을 부어요","빨대를 꽂아요","트레이에 올려요"]}
};

/* 에스프레소 자리 — 모든 메뉴 1컵 = 2샷 분량, 원두는 디카페인이 기본값 */
var SHOT_FULL = ["포터필터를 빼요","가루를 털고 마른 행주로 닦아요","원두를 담아요 (2샷 분량)",
                 "고르게 펴고 탬핑해요","머신에 끼워요","샷잔을 놓고 추출 버튼을 눌러요"];
var SHOT_SHORT= ["원두를 담아요 (2샷 분량)","탬핑해요","샷잔을 놓고 추출해요"];
var DELIVER   = "샷잔을 옆 자리에 전달해요";
var VAN_PRE   = ["샷잔에 바닐라 파우더 15g을 넣어요","바닐라 시럽을 1번 눌러 넣어요"];
var VAN_POST  = ["잘 저어서 파우더를 녹여요"];
var SHOT_ONE     = "에스프레소 2샷을 내려서 전달해요";
var SHOT_ONE_VAN = "샷잔에 파우더·시럽을 넣고 2샷을 내려 녹인 뒤 전달해요";
var MYCUP_STEP   = "개인컵을 가져와 이름을 확인해요";

var PLACES = {
  "보건실":1,"상담실":1,"개별학습반1":1,"진로실":1,"교장실":1,"행정실":1,
  "본교무실":2,"교육복지실":2,"2학년 교무실":2,
  "1학년 교무실":3,
  "3학년 교무실":4,
  "테이크아웃":0        /* 0 = 배달하지 않고 직접 가지러 오심 */
};

var KEY = "barista:day";

/* ══════════════════════════════════════════════════════════════════════
   [2] 상태
   ══════════════════════════════════════════════════════════════════════ */
var SYNC = (new URLSearchParams(location.search).get("sync") || SYNC_URL || "").trim();
var MODE = "solo";               /* cloud | shared | solo */
var online = false, netErr = "";
var station=null, tab="cup", making=null, overlay=false, sound=true, msg=null, busy=false;
var loaded=false, inflight=false, syncing=false;
var steps = {};                  /* 지금 몇 번째 단계인지 (기기별) */
var S = { level:1, help:0, cups:[] };

function today(){var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function now(){ return new Date().toISOString(); }
function hhmm(iso){ if(!iso) return "-"; var d=new Date(iso);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function hash(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h.toString(36); }

/* ══════════════════════════════════════════════════════════════════════
   [3] 주문 읽기
   ══════════════════════════════════════════════════════════════════════ */
function splitRows(text){
  var rows=[], row=[], cell="", q=false;
  var sep = (text.indexOf("\t")>=0 && text.indexOf(',"')<0) ? "\t" : ",";
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(function(r){ return r.some(function(v){ return String(v).trim()!==""; }); });
}
function menuKey(menuRaw, tempRaw){
  var m=String(menuRaw||"").replace(/\s/g,"");
  var t=(String(tempRaw||"")+m).replace(/\s/g,"");
  var ice=/아이스|ICE|ice|Ice|차가|콜드|cold/.test(t);
  var base = /바닐라/.test(m) ? "van" : /라떼|라테|latte/i.test(m) ? "latte"
           : /아메|americano/i.test(m) ? "ame" : null;
  return base ? base+(ice?"-i":"-h") : null;
}
function placeHit(s){
  if(s.length<2) return false;
  for(var p in PLACES){ var q=p.replace(/\s/g,"");
    if(s===q) return true;
    if(s.length>=3 && (s.indexOf(q)>=0||q.indexOf(s)>=0)) return true; }
  return false;
}
function placeName(raw){
  var v=String(raw||"").replace(/\s/g,"");
  for(var p in PLACES) if(p.replace(/\s/g,"")===v) return p;
  if(v.length>=3) for(var p2 in PLACES){ var q=p2.replace(/\s/g,"");
    if(v.indexOf(q)>=0||q.indexOf(v)>=0) return p2; }
  return (raw && String(raw).trim()) ? String(raw).trim() : "장소 미기재";
}
function parseTime(raw){
  var v=String(raw||"").trim(); if(!v) return null;
  var m=v.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})?/);
  if(m){ var h=+m[1], mi=m[2]?+m[2]:0;
    if(/오후|pm|PM/.test(v) && h<12) h+=12;
    if(h>=0&&h<24&&mi>=0&&mi<60) return h*60+mi; }
  return null;
}
/* 열 위치를 '칸에 든 내용'으로 찾습니다 — 머리글·열 순서·숨긴 열과 무관.
   안내문이나 빈 서식 줄에 휘둘리지 않도록 '메뉴가 적힌 줄'만 보고 판단합니다. */
function isSample(r){
  return r.some(function(v){ return String(v).replace(/\s/g,"")==="예시"; });
}
function detectCols(rows){
  var width=0; rows.forEach(function(r){ if(r.length>width) width=r.length; });
  function cell(r,i){ var v=String(r[i]||"").trim(); return v.length>30 ? "" : v; }  /* 긴 안내문은 무시 */

  /* 1차: 메뉴 열 찾기 */
  var menuCol=-1, best=0;
  for(var i=0;i<width;i++){
    var n=0;
    rows.forEach(function(r){ if(/아메|라떼|라테|바닐라|americano|latte/i.test(cell(r,i).replace(/\s/g,""))) n++; });
    if(n>best){ best=n; menuCol=i; }
  }
  if(menuCol<0) return {menu:-1};

  /* 2차: 메뉴가 실제로 적힌 줄만 골라 나머지 열을 판단 */
  var data = rows.filter(function(r){ return menuKey(cell(r,menuCol),"")!=null; });
  if(!data.length) data = rows;

  var score=[];
  for(var j=0;j<width;j++){
    var c={temp:0,place:0,cup:0,time:0,caf:0,filled:0};
    data.forEach(function(r){
      var v=cell(r,j); if(!v) return;
      var t=v.replace(/\s/g,""); c.filled++;
      if(/^(HOT|ICE|Hot|Ice|hot|ice|핫|아이스|따뜻한|차가운)$/.test(t)) c.temp++;
      if(placeHit(t)) c.place++;
      if(/개인컵|일회용|텀블러|머그컵|다회용|리유저블/.test(t)) c.cup++;
      if(parseTime(v)!=null) c.time++;
      if(/^(유|무|디카페인|카페인유|카페인무|있음|없음|해당없음|O|X)$/.test(t)) c.caf++;
    });
    score.push(c);
  }
  function pick(f){ var b=-1, bv=0;
    score.forEach(function(c,i){ if(i!==menuCol && c[f]>bv){ bv=c[f]; b=i; } });
    return bv>0?b:-1; }

  var ix={menu:menuCol, temp:pick("temp"), place:pick("place"),
          cup:pick("cup"), time:pick("time"), caf:pick("caf"), qty:-1};
  var used={}; for(var k in ix) if(ix[k]>=0) used[ix[k]]=1;

  /* 이름 = 메뉴 바로 왼쪽의 남은 칸 / 메모 = 메뉴 오른쪽 맨 끝의 남은 칸 */
  var restL=[], restR=[];
  for(var m=0;m<width;m++){
    if(used[m] || !score[m].filled) continue;
    (m<menuCol ? restL : restR).push(m);
  }
  ix.name = restL.length ? restL[restL.length-1] : (restR.length ? restR[0] : -1);
  ix.note = restR.length ? restR[restR.length-1] : -1;
  if(ix.note===ix.name) ix.note=-1;
  return ix;
}
function parseRows(rows){
  if(!rows || !rows.length) return {cups:[],skipped:0,rows:0,cols:0,first:""};
  var width=0; rows.forEach(function(r){ if(r.length>width) width=r.length; });
  var ix=detectCols(rows), cups=[], skipped=0, seen={};
  rows.forEach(function(r){
    if(isSample(r)) return;                       /* '예시' 줄은 주문이 아님 */
    function g(i){ return (i>=0 && r[i]!=null) ? String(r[i]) : ""; }
    var key=menuKey(g(ix.menu), g(ix.temp));
    if(!key){ skipped++; return; }
    var name=g(ix.name).trim()||"이름 미기재";
    var place=placeName(g(ix.place));
    var note=g(ix.note).trim();
    var timeRaw=g(ix.time).trim();
    var mycup=/개인|텀블러|머그|내컵|다회용|리유저블/.test(g(ix.cup).replace(/\s/g,""));
    var qty = ix.qty>=0 ? parseInt(g(ix.qty).replace(/[^0-9]/g,""),10) : 1;
    if(!qty||qty<1) qty=1; if(qty>20) qty=20;
    for(var i=0;i<qty;i++){
      var sig=[name,place,key,mycup?"M":"D",timeRaw].join("|");
      seen[sig]=(seen[sig]||0)+1;
      cups.push({ id:hash(sig)+seen[sig], name:name, place:place, menuKey:key, note:note,
                  mycup:mycup, timeRaw:timeRaw, timeMin:parseTime(timeRaw),
                  shot:false, cupPrep:false, finish:false, ship:false, t:{} });
    }
  });
  return {cups:cups, skipped:skipped, rows:rows.length, cols:width,
          first:(rows[0]||[]).join(" | ").slice(0,120)};
}
function parseOrders(text){ return parseRows(splitRows(text)); }

/* ══════════════════════════════════════════════════════════════════════
   [4] 저장 — 세 가지 모드
       cloud  : 구글 시트(Apps Script)와 연결. 두 태블릿 공유
       shared : Claude 화면 안에서 열었을 때. 두 태블릿 공유
       solo   : 연결 없음. 이 태블릿에서만
   ══════════════════════════════════════════════════════════════════════ */
async function callServer(qs){
  var url = SYNC + (SYNC.indexOf("?")>=0?"&":"?") + qs + "&_=" + Date.now();
  var res = await fetch(url, {method:"GET", redirect:"follow", cache:"no-store"});
  if(!res.ok) throw new Error("서버 응답 " + res.status);
  var d = await res.json();
  if(d.error) throw new Error(d.error);
  return d;
}
function applyServer(d){
  var prog = d.progress || {};
  if(!d.rows){                       /* 가벼운 응답: 진행 상황만 갱신 */
    S.cups.forEach(function(c){
      var p=prog[c.id];
      c.shot=!!(p&&p.shot); c.cupPrep=!!(p&&p.cupPrep);
      c.finish=!!(p&&p.finish); c.ship=!!(p&&p.ship); c.t=(p&&p.t)||{};
    });
    S.level=d.level||S.level; S.help=d.help||S.help; loaded=true; return;
  }
  var cups = parseRows(d.rows).cups;
  cups.forEach(function(c){
    var p = prog[c.id];
    if(p){ c.shot=!!p.shot; c.cupPrep=!!p.cupPrep; c.finish=!!p.finish; c.ship=!!p.ship; c.t=p.t||{}; }
  });
  S.cups = cups;
  S.level = d.level || 1;
  S.help  = d.help  || 0;
  loaded = true;
}
async function server(qs){
  if(inflight) return;
  inflight=true; syncing=true;
  try{ applyServer(await callServer(qs||"action=sync")); online=true; netErr=""; }
  catch(e){ online=false; netErr=(e&&e.message)?e.message:String(e); }
  finally{ inflight=false; syncing=false; }
}
async function sharedPull(){
  try{ var r=await window.storage.get(KEY,true);
    if(r&&r.value){ var d=JSON.parse(r.value); if((d.rev||0)>(S.rev||0)){ S=d; return true; } } }
  catch(e){}
  return false;
}
async function sharedPush(){
  try{ S.rev=(S.rev||0)+1; await window.storage.set(KEY,JSON.stringify(S),true); online=true; netErr=""; }
  catch(e){ online=false; netErr=(e&&e.message)?e.message:String(e); }
}
async function local(fn){
  if(MODE==="shared"){ await sharedPull(); fn(); await sharedPush(); }
  else fn();
  render();
}
async function detectMode(){
  if(SYNC){ MODE="cloud"; render(); await server("action=sync"); render(); return; }
  try{
    if(!window.storage) throw new Error("이 페이지에서는 공유 저장소를 쓸 수 없습니다");
    await window.storage.set(KEY+":probe", String(Date.now()), true);
    MODE="shared"; online=true; await sharedPull();
  }catch(e){
    MODE="solo"; online=false;
    netErr = "동기화 주소가 비어 있습니다. 파일 맨 위 SYNC_URL에 Apps Script 주소를 넣어 주세요.";
  }
}

/* 동작 — 모드에 관계없이 같은 함수를 씁니다 */
async function markCups(ids, field){
  if(MODE==="cloud"){
    /* 먼저 화면에 반영해 학생이 기다리지 않게 하고, 서버에는 뒤이어 알립니다 */
    S.cups.forEach(function(c){
      if(ids.indexOf(c.id)>=0){ c[field]=true; c.t=c.t||{}; c.t[field]=now(); } });
    render();
    var q = "action=mark&id="+encodeURIComponent(ids.join(","))+"&f="+field+"&light=1";
    var url = SYNC + (SYNC.indexOf("?")>=0?"&":"?") + q + "&_=" + Date.now();
    try{
      var res = await fetch(url,{method:"GET",redirect:"follow",cache:"no-store"});
      if(!res.ok) throw new Error("서버 응답 "+res.status);
      var d = await res.json();
      if(d.error) throw new Error(d.error);
      applyServer(d); online=true; netErr="";
    }catch(e){
      online=false; netErr=(e&&e.message)?e.message:String(e);
    }
    render();
  }else{
    await local(function(){
      S.cups.forEach(function(c){ if(ids.indexOf(c.id)>=0){ c[field]=true; c.t=c.t||{}; c.t[field]=now(); } });
    });
  }
}
async function bumpHelp(){
  if(MODE==="cloud"){ await server("action=help"); render(); }
  else await local(function(){ S.help=(S.help||0)+1; });
}
async function setLevel(v){
  if(MODE==="cloud"){ await server("action=level&v="+v); render(); }
  else await local(function(){ S.level=v; });
}
async function resetAll(){

  else await local(function(){ S.cups=[]; S.help=0; });
}

/* 혼자 모드용 주문 붙여넣기 */
async function importText(text){
  var r=parseOrders(text);
  if(!r.cups.length){
    msg={bad:true,s:"주문을 찾지 못했습니다. (읽은 내용: "+r.rows+"줄 × "+r.cols+"칸 / 첫 줄: "+(r.first||"비어 있음")+") 메뉴 칸에 아메리카노·카페라떼·바닐라라떼가 들어 있어야 합니다."};
    render(); return;
  }
  await local(function(){
    var keep={}; S.cups.forEach(function(c){ if(c.shot||c.cupPrep||c.finish||c.ship) keep[c.id]=c; });
    S.cups = r.cups.map(function(c){
      if(keep[c.id]){ keep[c.id].note=c.note; return keep[c.id]; } return c; });
  });
  msg={s:"주문 "+r.cups.length+"잔을 불러왔습니다."+(r.skipped?" (읽지 못한 줄 "+r.skipped+"개는 건너뛰었습니다.)":"")};
  render();
}

var actx=null;
function beep(f,ms){
  f=f||660; ms=ms||140;
  if(!sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=f; o.type="sine"; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+ms/1000);
    o.start(); o.stop(actx.currentTime+ms/1000+.02);
  }catch(e){}
}

    +'</tbody></table>'
    +'<div class="row"><button class="sbtn ghost" data-act="copy">기록 복사하기</button>'
    +'<button class="sbtn warn" data-act="reset">진행 상황 초기화</button></div></div>'
  +(msg?'<div class="msg '+(msg.bad?"bad":"")+'">'+esc(msg.s)+'</div>':'')
  +'</div>';
}

function render(){
  if(!station){
    root.innerHTML='<div class="pick"><div class="pick-in">'
      +'<h1>바리스타 주문판</h1><p>이 태블릿은 어느 자리에서 쓰나요? 한 번만 골라 주세요.</p>'
      +'<button class="pickbtn" data-pick="A"><b>에스프레소 자리</b><span>샷을 내려서 옆 자리에 전달합니다</span></button>'
      +'<button class="pickbtn" data-pick="B"><b>컵 준비 · 배달 자리</b><span>컵을 준비하고, 완성해서 배달합니다</span></button>'
      +'<button class="pickbtn" data-pick="T"><b>선생님 화면</b><span>연결 확인, 단계 조절, 기록 보기</span></button>'
      +'</div></div>';
    return;
  }
  if(station==="T"){ root.innerHTML=header()+teacherView(); return; }

  var body, cur = making ? S.cups.filter(function(c){return c.id===making;})[0] : null;
  if(cur) body='<div class="wrap">'+makeView(cur)+'</div>';
  else if(station==="A"){
    var l1=waitShot();
    body='<div class="wrap">'+(l1.length
      ? '<div class="grid">'+l1.map(function(c){return card(c,"",c.cupPrep?{s:"컵 준비가 끝났어요",ok:true}:null);}).join("")+'</div>'
      : emptyBox(loaded?"샷을 다 내렸습니다.":"주문을 불러오는 중입니다.", loaded?"새 주문이 들어오면 여기에 나타납니다.":"잠시만 기다려 주세요."))+'</div>';
  }
  else if(tab==="cup"){
    var l2=waitCup();
    body='<div class="wrap">'+(l2.length
      ? '<div class="grid">'+l2.map(function(c){return card(c,"",c.shot?{s:"샷이 준비됐어요",ok:true}:null);}).join("")+'</div>'
      : emptyBox(loaded?"컵을 다 준비했습니다.":"주문을 불러오는 중입니다.", loaded?"‘완성하기’ 칸을 확인해 주세요.":"잠시만 기다려 주세요."))+'</div>';
  }
  else if(tab==="fin"){
    var l3=waitFinish();
    var pend=S.cups.filter(function(c){return c.cupPrep&&!c.shot&&!c.finish;}).length;
    body='<div class="wrap">'+(l3.length
      ? '<div class="grid">'+l3.map(function(c){return card(c,"work",{s:"샷과 컵이 모두 준비됐어요",ok:true});}).join("")+'</div>'
      : emptyBox("완성할 음료가 없습니다.", pend?("샷을 기다리는 음료가 "+pend+"잔 있습니다."):"컵을 먼저 준비해 주세요."))+'</div>';
  }
  else body='<div class="wrap">'+shipView()+'</div>';

  root.innerHTML=header()+body+(overlay
    ? '<div class="overlay" data-act="closehelp"><div><div class="big">선생님을 불렀어요</div>'
      +'<p>기다리는 동안 잠깐 쉬어도 괜찮아요.</p>'
      +'<button class="btn go" style="padding:20px 40px" data-act="closehelp">돌아가기</button></div></div>':"");
}

/* ══════════════════════════════════════════════════════════════════════
   [7] 동작
   ══════════════════════════════════════════════════════════════════════ */
root.addEventListener("click", async function(e){
  var t=e.target.closest("[data-pick],[data-open],[data-act],[data-tab],[data-ship],[data-step]");
  if(!t) return;

  if(t.dataset.pick){ station=t.dataset.pick; msg=null; render(); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; making=null; render(); return; }
  if(t.dataset.open){ making=t.dataset.open; steps[making]=0; render(); return; }

  if(t.dataset.step!==undefined && making){
    var i=+t.dataset.step, at=steps[making]||0;
    steps[making] = (i===at) ? i+1 : i;
    beep(560,90); render(); return;
  }
  if(t.dataset.ship){
    var p=t.dataset.ship;
    var ids=waitShip().filter(function(c){return c.place===p;}).map(function(c){return c.id;});
    await markCups(ids,"ship"); beep(880,220); return;
  }

  var act=t.dataset.act;
  if(act==="sound"){ sound=!sound; if(sound) beep(700,120); render(); return; }
  if(act==="switch"){ station=null; making=null; render(); return; }
  if(act==="close"){ making=null; render(); return; }
  if(act==="closehelp"){ overlay=false; render(); return; }
  if(act==="help"){ overlay=true; beep(440,300); await bumpHelp(); return; }

  if(act==="done" && making){
    var id=making, field = station==="A" ? "shot" : (tab==="cup" ? "cupPrep" : "finish");
    making=null; beep(784,200);
    await markCups([id], field);
    return;
  }
  if(act==="probe"){
    if(MODE==="cloud"){ await server("action=sync");
      msg = online?{s:"시트와 연결되었습니다."}:{bad:true,s:"연결되지 않았습니다. 아래 원인을 확인해 주세요."}; }
    else { await detectMode(); msg={s:"현재 모드: "+MODE}; }
    render(); return;
  }
  if(act==="paste"){
    var v=document.getElementById("paste").value.trim();
    if(!v){ msg={bad:true,s:"붙여넣은 내용이 없습니다."}; render(); return; }
    await importText(v); return;
  }
  if(act==="level"){ await setLevel(+document.getElementById("lv").value);
    msg={s:"단계 수준을 저장했습니다."}; render(); return; }
  if(act==="copy"){
    var rows=[["메뉴","온도","컵","받는 분","장소","희망시간","샷","컵준비","완성","배달"].join("\t")];
    S.cups.slice().sort(byTime).forEach(function(c){ var m=MENUS[c.menuKey];
      rows.push([m.name,m.temp,c.mycup?"개인컵":"일회용",c.name,c.place,c.timeRaw||"",
        hhmm(c.t&&c.t.shot),hhmm(c.t&&c.t.cupPrep),hhmm(c.t&&c.t.finish),hhmm(c.t&&c.t.ship)].join("\t")); });
    var ta=document.createElement("textarea"); ta.value=rows.join("\n");
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); msg={s:"기록을 복사했습니다. 스프레드시트에 붙여넣으시면 됩니다."}; }
    catch(err){ msg={bad:true,s:"복사하지 못했습니다."}; }
    ta.remove(); render(); return;
  }
  if(act==="reset"){
    if(!confirm("진행 상황을 모두 지우고 새로 시작할까요? (주문 시트는 그대로 있습니다)")) return;
    await resetAll(); msg={s:"진행 상황을 초기화했습니다."}; render(); return;
  }
});

/* 주기적으로 시트·다른 태블릿 상태를 받아옵니다 */
setInterval(async function(){
  if(!station || busy) return;
  var el=document.activeElement;
  if(el && (el.tagName==="INPUT"||el.tagName==="TEXTAREA")) return;
  if(MODE==="cloud"){ if(inflight) return; await server("action=sync"); render(); }
  else if(MODE==="shared"){ if(await sharedPull()) render(); }
}, 6000);

render();
(async function(){ await detectMode(); render(); })();
</script>
</html>
